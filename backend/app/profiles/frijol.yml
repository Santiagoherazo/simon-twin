repro_stages: [FL, FR]
yield_potential_kg_m2: 1.0
stress: {ec_threshold_ds: 1.0, ec_slope_pct: 19, hypoxia_onset_h: 36, root_lethal_h: 72, susc_rootrot: 1.4}
sources: ['FAO-56 (Allen et al., 1998): Kc, p de agotamiento y duración de etapas (valores de tabla; GDD derivados
    de la duración × temperatura media típica)', 'FAO-29 / Maas-Hoffman: umbral y pendiente de salinidad', 'Manitoba
    Agriculture: el frijol seco es de los cultivos menos tolerantes al exceso de agua']
