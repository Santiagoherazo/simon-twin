name: Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      # Configura estas variables en Settings → Secrets and variables → Actions → Variables.
      # Si no existen, la app apunta a 127.0.0.1 (ver src/config.ts).
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_MQTT_URL: ${{ vars.VITE_MQTT_URL }}
      VITE_MQTT_USER: ${{ vars.VITE_MQTT_USER }}
      VITE_MQTT_PASS: ${{ secrets.VITE_MQTT_PASS }}
      VITE_DEFAULT_DEVICE: ${{ vars.VITE_DEFAULT_DEVICE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Compilar web y sincronizar Capacitor
        run: npm run cap:sync

      - name: Compilar APK (debug)
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: simon-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar APK en el release (solo tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/android/app/build/outputs/apk/debug/app-debug.apk
