# Mosquitto 2.x — configuración de desarrollo.
# Para producción añade un listener TLS (ver README) y deja 1883 solo en localhost.

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

# Sin conexiones anónimas: todo cliente necesita usuario y contraseña.
allow_anonymous false
# El archivo lo genera entrypoint.sh al arrancar (Mosquitto no admite comentarios al final de línea)
password_file /tmp/passwd
acl_file /mosquitto/config/acl

# MQTT clásico (ESP32, backend, simulador)
listener 1883
protocol mqtt

# MQTT sobre WebSockets (front 3D en el navegador)
listener 9001
protocol websockets

# Mensajes pequeños: telemetría de sensores
max_packet_size 16384
max_keepalive 120
